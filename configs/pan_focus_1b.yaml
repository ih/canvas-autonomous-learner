# pan_focus_1b — fresh 1B cold-start, shoulder_pan as the policy joint.
#
# Experiment goal: train a 1B world model from scratch where shoulder_pan
# is the ONLY policy/eval joint. elbow_flex stays in the explore pool
# purely as a data-diversity source (`vary_target_joint=true` makes the
# recorder pick a target joint uniformly per episode), so the model sees
# scenes where the elbow has moved without elbow being a learning target.
#
# Architecture: depth=28 / embed_dim=1408 / num_heads=22 → ~1.02B params.
# Training mechanics required to fit on a 32GB 5090:
#   - bf16 mixed precision (forward/backward in bf16, master weights fp32)
#   - gradient checkpointing on every transformer block
#   - bitsandbytes AdamW8bit optimizer state
#   - batch_size=1 with gradient_accumulation_steps=4 (effective batch=4)
#
# Cold-start: live_checkpoint is null and runs/pan_focus_1b/ does not
# exist on the first launch, so the orchestrator's cycle 0 takes the
# from-scratch path with `cold_start_epochs`.
#
# To launch:
#   python -m learner --config configs/pan_focus_1b.yaml
#
# Best checkpoint will appear in the live dashboard as
# "best pan_focus_1b (val_mse=...)" once at least one RETRAIN succeeds.

paths:
  canvas_world_model: ../canvas-world-model
  canvas_robot_control: ../canvas-robot-control
  robotic_foundation_model_tests: ../robotic-foundation-model-tests
  base_canvas: null
  val_dataset: null
  locked_val_shoulder: ./datasets/locked_val/shoulder
  locked_val_elbow: ./datasets/locked_val/elbow
  locked_val_dataset: ./datasets/locked_val/shoulder
  live_checkpoint: null
  ckpt_dir: ./runs/pan_focus_1b/checkpoints
  canvas_out: ./runs/pan_focus_1b/canvas
  lerobot_out: ./runs/pan_focus_1b/lerobot
  runs_dir: ./runs/pan_focus_1b
  registry_file: ./runs/pan_focus_1b/registry.json
  python: C:/Projects/pythonenv-lerobot/Scripts/python.exe

robot:
  port: COM3
  robot_id: my_so101_follower
  control_joint: shoulder_pan
  step_size: 10.0
  joint_min: -60.0
  joint_max: 60.0
  base_camera: 1
  wrist_camera: 0
  camera_width: 640
  camera_height: 480
  camera_fps: 10
  home:
    shoulder_pan: 21.07
    shoulder_lift: -100.00
    elbow_flex: 94.92
    wrist_flex: 31.82
    wrist_roll: 5.12
    gripper: 10.13

thresholds:
  tau_low: 0.005
  tau_high: 0.008
  val_guard: 1.5      # looser than 1.25 because 1B cold-start is noisy early
  max_consecutive_rejections: 3

cadence:
  idle_seconds: 0
  # Advisor has full reign over architecture + mechanics. The advisor is
  # responsible for pairing any state_dict-shape-changing override with
  # `from_scratch: true` so the next training subprocess rebuilds fresh
  # rather than crashing on a mismatched checkpoint load.
  claude_advisor_enabled: true
  claude_max_consecutive_retrains: 5
  claude_advisor_crash_timeout_s: 1800
  claude_advisor_model: opus
  claude_advisor_effort: max
  per_joint_targeting: true
  probes_per_verify: 6
  window_size: 24
  settle_time: 0.5
  base_explore_batch_size: 40
  explore_batch_size_min: 20
  explore_batch_size_max: 240
  max_sub_bursts: 8
  min_sub_burst_size: 20
  cold_start_epochs: 30
  ft_epochs: 20
  early_stop_patience: 6
  safety_cap_episodes: 3000
  warmup_cycles: 2
  explore_max_retries: 2
  explore_retry_backoff: 10.0
  training_stall_timeout_s: 1800
  retrain_timeout_s: 14400      # 4h ceiling for any single retrain at 1B

gpu:
  # 1B fine-tune at bf16 + grad-ckpt + 8-bit Adam peaks at ~31.9 GB on
  # the 5090's 32 GB. Spillover to host-shared memory above ~95% does
  # NOT raise OOM — CUDA silently moves working set over PCIe and
  # per-epoch wall time collapses 10-100x. train_diffusion.py's
  # `--gpu-mem-fraction 0.95` forces a clean OOM at 95%; this 0.96
  # nvidia-smi-driven abort is the backstop for non-allocator paths.
  memory_abort_frac: 0.96
  memory_warn_frac: 0.93
  sample_interval_s: 5.0

range:
  enabled: false

training:
  # Architecture — 28 layers x 1408 wide ≈ 1.02B params at patch=16
  patch_size: 16
  embed_dim: 1408
  depth: 28
  num_heads: 22

  # Training mechanics — all required at 1B on 32GB
  bf16: true
  gradient_checkpointing: true
  use_8bit_adam: true
  batch_size: 1
  gradient_accumulation_steps: 4   # effective batch = 4

  # Diffusion (unchanged from production)
  num_train_timesteps: 1000
  beta_schedule: cosine
  prediction_type: sample

  # Optimization
  lr: 3.0e-4
  weight_decay: 0.01
  lr_schedule: cosine
  warmup_epochs: 5
  min_lr: 1.0e-6
  grad_clip: 1.0
  seed: 42
  val_ratio: 0.1

  # Lock motor-strip normalization at SO-101 hardware limits
  motor_bounds:
    motor_norm_min: [-100.0, -100.0, -100.0, -100.0, -100.0, -100.0]
    motor_norm_max: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0]

actions:
  candidates: [1, 2, 3]
  probe_weights: null

explore:
  # Pooled two-joint exploration. The single_action policy picks a target
  # joint uniformly from `joints` each episode and ONLY that joint moves
  # during the recorded action. shoulder_pan is the policy/eval joint;
  # elbow_flex is here purely to diversify the visual scene.
  vary_target_joint: true
  joints:
    - shoulder_pan.pos
    - elbow_flex.pos
  joint_ranges:
    shoulder_pan.pos: [-60.0, 60.0]
    elbow_flex.pos: [50.0, 90.0]
  policy_joint_name: shoulder_pan.pos
  action_duration: 1.0
  start_buffer: 2.5
  dataset_fps: 10
  base_camera_name: base_0_rgb
  wrist_camera_name: left_wrist_0_rgb
  # Distinct prefix so this experiment's HF cache doesn't co-mingle with
  # sim_1b's. Anything written under runs/pan_focus_1b/ stays scoped to
  # this experiment.
  repo_id_prefix: pan_focus_1b/autonomous-explore
  inactive_joint_positions:
    shoulder_lift: -100.00
    wrist_flex: 31.82
    wrist_roll: 5.12
    gripper: 10.13

verify:
  repo_id_prefix: pan_focus_1b/autonomous-verify

dry_run: false

# red_kong_min_data — fresh experiment to measure minimum data for
# generalization. Same hardware + architecture as red_kong_1b, but with
# scene-rotation cadence forced to "after every accepted retrain" and
# per-scene episode tracking enabled, so we can plot
# wide_verify_mse(num_scenes, eps_per_scene) cleanly.
#
# Differences from red_kong_1b:
#   - Fresh runs/ dir (`runs/red_kong_min_data`) so the registry starts
#     empty (cycle 0, scene_idx 0). No carry-over from prior sessions.
#   - `cadence.scene_change_after_accepted_retrain: true` — every
#     accepted retrain queues an IDLE-path scene-change request,
#     bypassing advisor judgment on cadence. Operator click → bump
#     scene_idx → straight to EXPLORE on the new scene.
#   - `parallel_record_during_retrain_episodes: 0` — no background
#     recording; data growth is purely foreground EXPLORE bursts so
#     eps-per-scene is a controlled variable.
#   - `claude_advisor_enabled: false` initially — fully deterministic
#     per-cycle behavior so the experiment reads as a clean sweep.
#     Re-enable later if you want adaptive routing back.
#   - `base_explore_batch_size` reduced to a fixed lower budget so
#     each scene gets a comparable eps allocation; we want to find
#     the MINIMUM eps-per-scene needed, not load up the per-scene
#     count with a generous default.
#
# To launch (FRESH cold-start):
#   python -m learner --config configs/red_kong_min_data.yaml

paths:
  canvas_world_model: ../canvas-world-model
  canvas_robot_control: ../canvas-robot-control
  robotic_foundation_model_tests: ../robotic-foundation-model-tests
  base_canvas: null
  val_dataset: null
  # Reuse the existing locked_val (fixed eval set, training-data-
  # independent) so locked_val_mse is comparable to red_kong_1b.
  locked_val_shoulder: ./datasets/locked_val_red_kong/shoulder
  locked_val_elbow: null
  locked_val_dataset: ./datasets/locked_val_red_kong/shoulder
  live_checkpoint: null
  ckpt_dir: ./runs/red_kong_min_data/checkpoints
  canvas_out: ./runs/red_kong_min_data/canvas
  lerobot_out: ./runs/red_kong_min_data/lerobot
  runs_dir: ./runs/red_kong_min_data
  registry_file: ./runs/red_kong_min_data/registry.json
  python: C:/Projects/pythonenv-lerobot/Scripts/python.exe

robot:
  port: COM3
  robot_id: my_so101_follower
  control_joint: shoulder_pan
  step_size: 10.0
  joint_min: -60.0
  joint_max: 60.0
  base_camera: 1
  wrist_camera: 0
  camera_width: 640
  camera_height: 480
  camera_fps: 10
  home:
    shoulder_pan: 21.07
    shoulder_lift: -100.00
    elbow_flex: 94.92
    wrist_flex: 31.82
    wrist_roll: 5.12
    gripper: 10.13

thresholds:
  tau_low: 0.005
  tau_high: 0.008
  val_guard: 1.5
  max_consecutive_rejections: 3

cadence:
  idle_seconds: 0
  lifelong_mode: true
  # Advisor disabled for the deterministic min-data sweep. Each
  # accepted retrain triggers a forced scene rotation; in between,
  # the orchestrator's default routing handles VERIFY/EXPLORE/RETRAIN
  # without per-cycle advisor judgment.
  claude_advisor_enabled: false
  per_joint_targeting: true
  # Forced scene rotation after every accepted retrain — the central
  # min-data-experiment knob. Together with claude_advisor_enabled=false
  # this turns the loop into a deterministic sweep through scenes.
  scene_change_after_accepted_retrain: true
  probes_per_verify: 6
  window_size: 24
  settle_time: 0.5
  # Fixed per-scene eps budget. Sweeping num_scenes at constant
  # eps_per_scene is the cleanest path to a min-data answer; bump
  # this if you want to study eps-per-scene as a separate axis.
  base_explore_batch_size: 100
  explore_batch_size_min: 100
  explore_batch_size_max: 100
  max_sub_bursts: 4
  min_sub_burst_size: 25
  cold_start_epochs: 30
  ft_epochs: 20
  early_stop_patience: 6
  max_consecutive_cold_starts: 2
  cold_start_cap_wide_verify_regress_ratio: 1.15
  # No background recording — same-scene redundancy would inflate the
  # eps axis without contributing to generalization, biasing the
  # min-data answer. See learner/background_recorder.py.
  parallel_record_during_retrain_episodes: 0
  safety_cap_episodes: 5000
  warmup_cycles: 2
  explore_max_retries: 2
  explore_retry_backoff: 10.0
  training_stall_timeout_s: 1800
  retrain_timeout_s: 14400

gpu:
  memory_fraction: 0.95
  memory_abort_frac: 0.96
  memory_warn_frac: 0.93
  sample_interval_s: 5.0

range:
  enabled: false

training:
  patch_size: 16
  embed_dim: 1408
  depth: 28
  num_heads: 22

  bf16: true
  gradient_checkpointing: true
  use_8bit_adam: true
  batch_size: 1
  gradient_accumulation_steps: 4

  num_train_timesteps: 1000
  beta_schedule: cosine
  prediction_type: sample

  lr: 3.0e-4
  weight_decay: 0.01
  lr_schedule: cosine
  warmup_epochs: 5
  min_lr: 1.0e-6
  grad_clip: 1.0
  seed: 42
  val_ratio: 0.1

  motor_bounds:
    motor_norm_min: [-100.0, -100.0, -100.0, -100.0, -100.0, -100.0]
    motor_norm_max: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0]

actions:
  candidates: [1, 2, 3]
  probe_weights: null

explore:
  vary_target_joint: false
  joint_ranges:
    shoulder_pan.pos: [-60.0, 60.0]
  policy_joint_name: shoulder_pan.pos
  action_duration: 1.0
  start_buffer: 2.5
  dataset_fps: 10
  base_camera_name: base_0_rgb
  wrist_camera_name: left_wrist_0_rgb
  repo_id_prefix: red_kong_min_data/autonomous-explore
  inactive_joint_positions:
    shoulder_lift: -100.00
    elbow_flex: 94.92
    wrist_flex: 31.82
    wrist_roll: 5.12
    gripper: 10.13

verify:
  repo_id_prefix: red_kong_min_data/autonomous-verify

dry_run: false

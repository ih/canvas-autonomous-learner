<!doctype html>
<html><head><meta charset="utf-8"><title>live inference</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --ink:#e6e8ef; --muted:#8a93a6; --accent:#5aa9ff; --warn:#ff9c5a; --ok:#65d88c; --bad:#ff6464; }
  html, body { background: var(--bg); color: var(--ink); font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; }
  header { padding: 12px 20px; border-bottom: 1px solid #2a2f3b; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .pill { font-size: 11px; padding: 3px 9px; border-radius: 12px; background:#2a2f3b; color: var(--muted); }
  .pill.ok { background:#12361e; color: var(--ok); }
  .pill.bad { background:#3a1212; color: var(--bad); }
  main { display: grid; grid-template-columns: minmax(320px, 480px) 1fr; gap: 14px; padding: 14px 20px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid #232735; border-radius: 8px; padding: 12px 14px; }
  .panel h2 { font-size: 11px; margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
  img.canvas { display: block; max-width: 100%; width: auto; height: auto; max-height: calc((100vh - 140px) / 2); margin: 0 auto; border: 1px solid #2a2f3b; border-radius: 4px; background: #000; object-fit: contain; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  select, button { background: #1d2230; color: var(--ink); border: 1px solid #2b3246; padding: 6px 10px; border-radius: 4px; font-size: 13px; font-family: inherit; }
  button { cursor: pointer; }
  button.primary { background: #2e9a4f; color: #fff; border: 0; padding: 8px 16px; font-weight: 600; }
  button.primary:hover { background: #37b35a; }
  button.warn { background: #b35a2e; color: #fff; border: 0; padding: 8px 16px; font-weight: 600; }
  button.warn:hover { background: #cc6933; }
  button.muted { background: #2a2f3b; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .radio-group { display: flex; gap: 12px; margin-top: 4px; }
  .radio-group label { color: var(--ink); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; margin: 0; }
  .status { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; }
  .status.err { color: var(--bad); }
  .status.ok { color: var(--ok); }
  .note { font-size: 11px; color: var(--muted); margin-top: 10px; padding: 6px 8px; background: #12151c; border-left: 2px solid #3a4254; border-radius: 2px; }
  .before-ts { font-size: 11px; color: var(--muted); margin-top: 6px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .canvas-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .empty { color: var(--muted); font-style: italic; font-size: 12px; padding: 20px; text-align: center; }
  kbd { display: inline-block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; padding: 1px 5px; margin-left: 4px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.18); border-radius: 3px; color: inherit; opacity: 0.85; vertical-align: middle; }
  .bc-prob { display: flex; align-items: center; gap: 6px; margin: 3px 0; font-size: 12px; }
  .bc-prob .label { width: 50px; text-align: right; color: var(--muted); }
  .bc-prob .bar-bg { flex: 1; height: 14px; background: #1d2230; border-radius: 3px; overflow: hidden; }
  .bc-prob .bar { height: 100%; border-radius: 3px; transition: width 0.2s; }
  .bc-prob .bar.move-pos { background: #2e9a4f; }
  .bc-prob .bar.move-neg { background: #4488dd; }
  .bc-prob .bar.stay { background: #cc4444; }
  .bc-prob .bar.winner { box-shadow: 0 0 6px rgba(255,255,255,0.3); }
  .bc-prob .val { width: 45px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
  .bc-action { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .bc-auto-active { background: #b35a2e !important; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.7; } }
</style></head><body>

<header>
  <h1>live-inference dashboard</h1>
  <span class="pill" id="mode-pill">—</span>
  <span class="pill ok" id="torque-pill">torque: on</span>
  <span class="pill" id="joint-pill">joint: —</span>
  <span class="pill" id="model-pill">model: —</span>
  <span class="pill" id="ckpt-pill">ckpt: —</span>
</header>

<main>
  <div class="panel">
    <h2>Controls</h2>

    <label for="model-select">Model</label>
    <select id="model-select"></select>
    <div class="note" id="model-note"></div>

    <label for="joint-select">Joint</label>
    <select id="joint-select"></select>
    <div class="note" id="joint-note"></div>

    <label>Action</label>
    <div class="radio-group">
      <label><input type="radio" name="action" value="1" checked> move+ <kbd>1</kbd></label>
      <label><input type="radio" name="action" value="2"> move- <kbd>2</kbd></label>
      <label><input type="radio" name="action" value="3"> hold <kbd>3</kbd></label>
    </div>

    <div class="row">
      <button class="primary" id="btn-predict" title="Predict (P)">Predict <kbd>P</kbd></button>
      <button class="primary" id="btn-execute" title="Execute on robot (E)">Execute on robot <kbd>E</kbd></button>
      <button class="muted" id="btn-clear" title="Clear before (C)">Clear before <kbd>C</kbd></button>
    </div>
    <div class="before-ts" id="before-ts">before: (none captured)</div>
    <div class="status" id="status"></div>

    <label style="margin-top: 18px;">Joint torque</label>
    <div class="row">
      <button class="warn" id="btn-relax" title="Relax joints (R)">Relax joints <kbd>R</kbd></button>
      <button class="primary" id="btn-lock" title="Lock joints (L)">Lock joints <kbd>L</kbd></button>
    </div>

    <div id="bc-controls" style="display:none;">
      <label style="margin-top: 18px;">BC Policy</label>
      <div class="row">
        <button class="primary" id="btn-bc-predict" title="BC Predict (B)">BC Predict <kbd>B</kbd></button>
        <button class="primary" id="btn-bc-step" title="BC Step (N)">BC Step <kbd>N</kbd></button>
        <button class="muted" id="btn-bc-auto" title="BC Auto (A)">BC Auto <kbd>A</kbd></button>
      </div>
      <div id="bc-result" style="margin-top: 8px;"></div>
    </div>
  </div>

  <div>
    <div class="panel" style="margin-bottom: 14px;">
      <div class="canvas-label">Predicted canvas <span style="color:var(--muted);font-transform:none;text-transform:none;">(before | action_sep | predicted)</span></div>
      <div id="predicted-wrap"><div class="empty">(click Predict)</div></div>
    </div>
    <div class="panel">
      <div class="canvas-label">Actual canvas <span style="text-transform:none;">(before | action_sep | actual)</span></div>
      <div id="actual-wrap"><div class="empty">(click Execute)</div></div>
    </div>
  </div>
</main>

<script>
const JOINTS = __JOINTS__;
const CONTROL_JOINT = "__CONTROL_JOINT__";
const MODE = "__MODE__";
const MODEL_OPTIONS = __MODEL_OPTIONS__;
const INITIAL_MODEL_KEY = "__INITIAL_MODEL_KEY__";
const INITIAL_MODEL_CKPT = "__INITIAL_MODEL_CKPT__";

document.getElementById("mode-pill").textContent = "mode: " + MODE;
document.getElementById("joint-pill").textContent = "joint: " + CONTROL_JOINT;

function shortCkpt(p) {
  if (!p) return "—";
  const parts = p.replace(/\\/g, "/").split("/");
  return parts.slice(-2).join("/");
}
function modelPillClass(key) {
  // Highlight live + autonomous-learner-best as "current/promoted" (green).
  if (key === "live" || key === "best_learner" || key === "best_1b") return "pill ok";
  return "pill";
}
function updateModelPills(key, ckpt) {
  document.getElementById("model-pill").textContent = "model: " + key;
  document.getElementById("ckpt-pill").textContent = "ckpt: " + shortCkpt(ckpt);
  document.getElementById("model-pill").className = modelPillClass(key);
}
updateModelPills(INITIAL_MODEL_KEY, INITIAL_MODEL_CKPT);

const modelSelect = document.getElementById("model-select");
let lastModelKey = INITIAL_MODEL_KEY;

function populateModelSelect() {
  modelSelect.innerHTML = "";
  if (!MODEL_OPTIONS || MODEL_OPTIONS.length === 0) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "(no models discovered)";
    opt.disabled = true;
    modelSelect.appendChild(opt);
    return;
  }
  for (const m of MODEL_OPTIONS) {
    const opt = document.createElement("option");
    opt.value = m.key;
    opt.textContent = m.label;
    opt.dataset.note = m.note || "";
    if (m.key === INITIAL_MODEL_KEY) opt.selected = true;
    modelSelect.appendChild(opt);
  }
}
populateModelSelect();

function updateModelNote() {
  const note = document.getElementById("model-note");
  const opt = modelSelect.selectedOptions[0];
  note.textContent = (opt && opt.dataset.note) || "";
  note.style.borderLeftColor = "#3a4254";
}
updateModelNote();

modelSelect.addEventListener("change", async () => {
  updateModelNote();
  const chosen = modelSelect.value;
  if (!chosen) return;
  setStatus("loading " + chosen + " model (this may take 10-30s)...", "");
  modelSelect.disabled = true;
  try {
    const res = await postJSON("/api/set_model", {model: chosen});
    updateModelPills(res.active_model, res.active_checkpoint);
    setStatus("loaded model: " + (res.active_label || res.active_model), "ok");
    lastModelKey = res.active_model;
  } catch (e) {
    setStatus("model switch failed: " + e.message, "err");
    modelSelect.value = lastModelKey;
    updateModelNote();
  } finally {
    modelSelect.disabled = false;
  }
});

const jointSelect = document.getElementById("joint-select");
for (const j of JOINTS) {
  const opt = document.createElement("option");
  opt.value = j;
  opt.textContent = j;
  if (j === CONTROL_JOINT) opt.selected = true;
  jointSelect.appendChild(opt);
}

function updateJointNote() {
  const j = jointSelect.value;
  const note = document.getElementById("joint-note");
  if (j === CONTROL_JOINT) {
    note.textContent = "Model was trained on this joint — predictions are in-distribution.";
    note.style.borderLeftColor = "#3a4254";
  } else {
    note.textContent = "Off-joint QA probe: the world model was trained on '" + CONTROL_JOINT + "', so predictions on this joint may be out-of-distribution.";
    note.style.borderLeftColor = "#b35a2e";
  }
}
jointSelect.addEventListener("change", updateJointNote);
updateJointNote();

function currentAction() {
  const el = document.querySelector('input[name=action]:checked');
  return el ? parseInt(el.value, 10) : 3;
}

function setStatus(msg, cls) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status " + (cls || "");
}

function setBeforeTs(ts) {
  const el = document.getElementById("before-ts");
  if (ts == null) {
    el.textContent = "before: (none captured)";
  } else {
    const d = new Date(ts * 1000);
    el.textContent = "before captured at: " + d.toLocaleTimeString();
  }
}

function setTorque(on) {
  const pill = document.getElementById("torque-pill");
  pill.textContent = "torque: " + (on ? "on" : "off");
  pill.className = on ? "pill ok" : "pill bad";
}

async function postJSON(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {}),
  });
  const t = await r.text();
  let j;
  try { j = JSON.parse(t); } catch { j = {error: t}; }
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

function renderCanvas(wrapId, token, meta) {
  const w = document.getElementById(wrapId);
  if (!token) { w.innerHTML = '<div class="empty">(no canvas)</div>'; return; }
  w.innerHTML = '<img class="canvas" src="/canvas/' + token + '?t=' + Date.now() + '"/>' +
    (meta ? '<div class="before-ts">' + meta + '</div>' : '');
}

document.getElementById("btn-predict").addEventListener("click", async () => {
  setStatus("predicting...", "");
  const btn = document.getElementById("btn-predict");
  btn.disabled = true;
  try {
    const res = await postJSON("/api/predict", {
      action: currentAction(), joint: jointSelect.value,
    });
    setBeforeTs(res.before_captured_at);
    renderCanvas("predicted-wrap", res.canvas_token, "action=" + currentAction() + ", joint=" + jointSelect.value);
    setStatus("predicted.", "ok");
  } catch (e) {
    setStatus("predict failed: " + e.message, "err");
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("btn-execute").addEventListener("click", async () => {
  if (!confirm("Execute on the real robot?")) return;
  setStatus("executing...", "");
  const btn = document.getElementById("btn-execute");
  btn.disabled = true;
  try {
    const res = await postJSON("/api/execute", {
      action: currentAction(), joint: jointSelect.value,
    });
    setBeforeTs(null);  // execute clears the before
    renderCanvas("actual-wrap", res.canvas_token, "action=" + currentAction() + ", joint=" + jointSelect.value);
    setStatus("executed.", "ok");
  } catch (e) {
    setStatus("execute failed: " + e.message, "err");
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("btn-clear").addEventListener("click", async () => {
  try {
    await postJSON("/api/clear_before", {});
    setBeforeTs(null);
    setStatus("cleared before.", "ok");
  } catch (e) {
    setStatus("clear failed: " + e.message, "err");
  }
});

document.getElementById("btn-relax").addEventListener("click", async () => {
  setStatus("relaxing joints...", "");
  try {
    await postJSON("/api/relax", {});
    setTorque(false);
    setStatus("joints relaxed — move by hand.", "ok");
  } catch (e) {
    setStatus("relax failed: " + e.message, "err");
  }
});

document.getElementById("btn-lock").addEventListener("click", async () => {
  setStatus("locking joints...", "");
  try {
    await postJSON("/api/lock", {});
    setTorque(true);
    setStatus("joints locked at current position.", "ok");
  } catch (e) {
    setStatus("lock failed: " + e.message, "err");
  }
});

// Keyboard shortcuts. Skip when typing in form fields or with modifier keys
// (so browser shortcuts like Ctrl+L still work).
const KEY_TO_BUTTON = {
  p: "btn-predict",
  e: "btn-execute",
  c: "btn-clear",
  r: "btn-relax",
  l: "btn-lock",
};
document.addEventListener("keydown", (ev) => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const tag = (ev.target && ev.target.tagName) || "";
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || ev.target.isContentEditable) return;
  const key = ev.key.toLowerCase();
  if (key === "1" || key === "2" || key === "3") {
    const radio = document.querySelector('input[name=action][value="' + key + '"]');
    if (radio) { radio.checked = true; ev.preventDefault(); }
    return;
  }
  const btnId = KEY_TO_BUTTON[key];
  if (!btnId) return;
  const btn = document.getElementById(btnId);
  if (!btn || btn.disabled) return;
  ev.preventDefault();
  btn.click();
});

// ---- BC Policy controls ----
const BC_ENABLED = __BC_ENABLED__;
if (BC_ENABLED) {
  document.getElementById("bc-controls").style.display = "block";
}

const ACTION_COLORS = {"move+": "move-pos", "move-": "move-neg", "stay": "stay"};

function renderBCResult(res) {
  const el = document.getElementById("bc-result");
  const probs = res.probabilities || {};
  let html = '<div class="bc-action">→ ' + res.action_name + ' (' + (res.confidence * 100).toFixed(1) + '%)</div>';
  for (const [name, p] of Object.entries(probs)) {
    const pct = (p * 100).toFixed(1);
    const isWinner = name === res.action_name;
    html += '<div class="bc-prob">' +
      '<span class="label">' + name + '</span>' +
      '<div class="bar-bg"><div class="bar ' + ACTION_COLORS[name] + (isWinner ? ' winner' : '') + '" style="width:' + pct + '%"></div></div>' +
      '<span class="val">' + pct + '%</span></div>';
  }
  el.innerHTML = html;
}

document.getElementById("btn-bc-predict").addEventListener("click", async () => {
  setStatus("BC predicting...", "");
  const btn = document.getElementById("btn-bc-predict");
  btn.disabled = true;
  try {
    const res = await postJSON("/api/bc_predict", {});
    renderBCResult(res);
    setStatus("BC: " + res.action_name + " (" + (res.confidence * 100).toFixed(1) + "%)", "ok");
  } catch (e) {
    setStatus("BC predict failed: " + e.message, "err");
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("btn-bc-step").addEventListener("click", async () => {
  setStatus("BC stepping...", "");
  const btn = document.getElementById("btn-bc-step");
  btn.disabled = true;
  try {
    const res = await postJSON("/api/bc_step", {});
    renderBCResult(res);
    setBeforeTs(null);
    setStatus("BC step: " + res.action_name + " executed", "ok");
  } catch (e) {
    setStatus("BC step failed: " + e.message, "err");
  } finally {
    btn.disabled = false;
  }
});

let bcAutoInterval = null;
document.getElementById("btn-bc-auto").addEventListener("click", async () => {
  const btn = document.getElementById("btn-bc-auto");
  if (bcAutoInterval) {
    clearInterval(bcAutoInterval);
    bcAutoInterval = null;
    btn.classList.remove("bc-auto-active");
    btn.textContent = "BC Auto";
    await postJSON("/api/bc_auto", {running: false}).catch(() => {});
    setStatus("BC auto stopped.", "ok");
    return;
  }
  btn.classList.add("bc-auto-active");
  btn.textContent = "⏹ Stop Auto";
  await postJSON("/api/bc_auto", {running: true}).catch(() => {});
  setStatus("BC auto running...", "ok");
  async function step() {
    try {
      const res = await postJSON("/api/bc_step", {});
      renderBCResult(res);
      setStatus("BC auto: " + res.action_name + " (" + (res.confidence * 100).toFixed(1) + "%)", "ok");
    } catch (e) {
      setStatus("BC auto error: " + e.message, "err");
      clearInterval(bcAutoInterval);
      bcAutoInterval = null;
      btn.classList.remove("bc-auto-active");
      btn.textContent = "BC Auto";
    }
  }
  step();
  bcAutoInterval = setInterval(step, 2000);
});

// Add BC keyboard shortcuts
KEY_TO_BUTTON["b"] = "btn-bc-predict";
KEY_TO_BUTTON["n"] = "btn-bc-step";
KEY_TO_BUTTON["a"] = "btn-bc-auto";
</script>
</body></html>
